[project]
name = "vmlogs-cli"
version = "0.1.0"
description = "Поиск логов в VictoriaLogs из терминала и для агентов: LogsQL как есть, компактный вывод"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vmlogs-cli = "vmlogs_cli.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vmlogs_cli"]

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "UP045"]
