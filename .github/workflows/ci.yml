name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv run --python ${{ matrix.python }} python -m unittest discover -s tests -v
      - if: matrix.python == '3.13'
        run: uv run ruff check .
      - if: matrix.python == '3.13'
        run: uv run ruff format --check .
